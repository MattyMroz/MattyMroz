minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]
exclude: ^\.hooks/

repos:
  - repo: meta
    hooks:
      - id: check-hooks-apply
        stages: [manual]
      - id: check-useless-excludes
        stages: [manual]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: fix-byte-order-marker
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
        stages: [pre-commit]
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: detect-private-key
      - id: forbid-submodules
      - id: destroyed-symlinks
        stages: [pre-commit]
      - id: check-json

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - --force-scope
          - --scopes=docs,repo
          - feat
          - fix
          - chore
          - docs
          - refactor
          - test
          - perf
          - style
          - ci
          - build
          - revert

  - repo: https://github.com/crate-ci/typos
    rev: v1.49.0
    hooks:
      - id: typos
        args: [--force-exclude]
        types_or: [python, pyi, javascript, jsx, ts, tsx, rust, shell]
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: no-replacement-char
        name: no U+FFFD replacement character
        entry: python .hooks/text_guard.py
        language: python
        types: [text]
      - id: no-secret-tokens
        name: no API tokens in tracked files
        entry: python .hooks/secret_tokens.py
        language: python
        types: [text]
      - id: no-ai-trailers
        name: no AI attribution in the commit message
        entry: python .hooks/ai_trailers.py
        language: python
        stages: [commit-msg]
